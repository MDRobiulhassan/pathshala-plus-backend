spring:
  profiles:
    active: dev
  config:
    import: "optional:classpath:application.yaml"
  application:
    name: pathshala-plus-backend


  datasource:
    URL: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/google"
        provider:
            google:
                authorization-uri: https://accounts.google.com/o/oauth2/auth
                token-uri: https://oauth2.googleapis.com/token
                user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
                user-name-attribute: sub

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES}
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}

app:
    frontend-url: ${FRONTEND_URL}
    oauth2:
      cookie-name: auth_token
      cookie-max-age: 180
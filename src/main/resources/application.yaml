spring:
  profiles:
    active: dev
  config:
    import: "optional:classpath:application.yaml"
  application:
    name: pathshala-plus-backend


  datasource:
    URL: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI}
        provider:
            google:
                authorization-uri: ${GOOGLE_AUTHORIZATION_URI}
                token-uri: ${GOOGLE_TOKEN_URI}
                user-info-uri: ${GOOGLE_USER_INFO_URI}
                user-name-attribute: ${GOOGLE_USER_NAME_ATTRIBUTE}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES}
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}

app:
    frontend-url: ${FRONTEND_URL}